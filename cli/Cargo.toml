[package]
name = "cli"
version = "0.0.1"
description = "Command-line utility for Liane"
edition = "2024"
default-run = "liane"

[[bin]]
name = "liane"
path = "src/bin/liane.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
itertools = "0"
dns-lookup = "3"
serde_json = "1"

[package.metadata.commands]
install = "cargo install --path ."
uninstall = "cargo uninstall liane"
