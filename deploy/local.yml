# Développement local : base et tuiles seulement ; l'API (cargo run) et le site (yarn dev) tournent sur le poste.
# Les ports ne sont ouverts que sur la machine elle-même (127.0.0.1).
services:

  postgres:
    image: "postgis/postgis:18-3.6"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: liane
      POSTGRES_USER: liane
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "${LIANE_HOME}/data/postgres:/var/lib/postgresql/18/docker"
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config.yaml"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - "./martin/config.yaml:/config.yaml:ro"
    environment:
      DB_USER: liane
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    restart: unless-stopped

  # Facultatif : tracé routier des lianes. Activé par COMPOSE_PROFILES=osrm dans deploy/.env,
  # avec OSRM_URL=http://localhost:5001. Les fichiers .osrm sont attendus dans data/osrm.
  osrm:
    profiles: [osrm]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: ["osrm-routed", "--algorithm", "mld", "/data/${OSRM_DATA_FILE:-occitanie.osrm}"]
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - "${LIANE_HOME}/data/osrm:/data:ro"
    restart: unless-stopped
